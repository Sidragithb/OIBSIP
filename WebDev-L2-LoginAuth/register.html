<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registration page of a client-side authentication system.">
  <title>Register | SecureAuth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">&#128274;</span>
      <span class="brand-name">SecureAuth</span>
    </div>

    <h1>Create your account</h1>
    <p class="lead">It only takes a minute.</p>

    <div id="alert" class="alert" role="alert" hidden></div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="20" autofocus>
        <p class="field-hint">3&ndash;20 characters: letters, numbers or underscore.</p>
        <p class="field-error" id="username-error"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <p class="field-error" id="email-error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="password" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
        <ul class="password-rules" aria-live="polite">
          <li id="rule-length">At least 8 characters</li>
          <li id="rule-number">At least 1 number</li>
        </ul>
        <p class="field-error" id="password-error"></p>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <div class="password-wrap">
          <input id="confirm" name="confirm" type="password" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="confirm" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
        <p class="field-error" id="confirm-error"></p>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Register</button>
    </form>

    <p class="switch">Already have an account? <a href="index.html">Log in</a></p>
  </main>

  <script src="auth.js"></script>
  <script src="register.js"></script>
</body>
</html>
